name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build expressvpn-qt
        run: nix build .#expressvpn-qt --print-build-logs
      - name: Flake check
        run: nix flake check --print-build-logs
